name: Send Push Notifications (Production)

on:
  schedule:
    # ============================================================================
    # Unified Schedule - Each cron appears exactly once
    # Job-level if-conditions determine which notifications run at each hour
    # ============================================================================
    #
    # Hour mapping (all notifications that run at each UTC hour):
    # UTC 0:  Daily Verse (6 AM UTC+6), Memory Verse Reminder (9 AM UTC+9)
    # UTC 2:  Recommended Topic (8 AM UTC+6)
    # UTC 3:  Daily Verse (6 AM UTC+3), Memory Verse Reminder (9 AM UTC+6)
    # UTC 5:  Recommended Topic (8 AM UTC+3)
    # UTC 6:  Daily Verse (6 AM UTC+0), Memory Verse Reminder (9 AM UTC+3)
    # UTC 8:  Recommended Topic (8 AM UTC+0)
    # UTC 9:  Daily Verse (6 AM UTC-3), Memory Verse Reminder (9 AM UTC+0)
    # UTC 11: Recommended Topic (8 AM UTC-3)
    # UTC 12: Daily Verse (6 AM UTC-6), Memory Verse Reminder (9 AM UTC-3)
    # UTC 14: Recommended Topic (8 AM UTC-6)
    # UTC 15: Daily Verse (6 AM UTC-9), Memory Verse Reminder (9 AM UTC-6)
    # UTC 17: Recommended Topic (8 AM UTC-9)
    # UTC 18: Daily Verse (6 AM UTC+12), Memory Verse Reminder (9 AM UTC-9)
    # UTC 20: Recommended Topic (8 AM UTC+12)
    # UTC 21: Daily Verse (6 AM UTC+9), Memory Verse Reminder (9 AM UTC+12)
    # UTC 23: Recommended Topic (8 AM UTC+9)
    #
    # ============================================================================

    # Hourly trigger for Streak Reminders (user's preferred time)
    # Also covers all notification hours - job if-conditions filter appropriately
    - cron: '0 * * * *'   # Every hour at :00 minutes

    # ============================================================================
    # Memory Verse Overdue Notifications (6 PM across timezones)
    # ============================================================================
    # 6 PM local time converted to UTC for each major timezone band:
    # UTC  1: 6 PM UTC-5  (US Eastern Standard / Latin America)
    # UTC  7: 6 PM UTC+1  (Central Europe / West Africa)
    # UTC 10: 6 PM UTC+4  (Gulf / Mauritius) — also close to UTC+8 East Asia at 10 PM
    # UTC 12: 6 PM UTC+6  (Bangladesh) / ~5:30 PM UTC+5:30 (IST)
    # UTC 16: 6 PM UTC+10 (Australia Eastern)
    # UTC 22: 6 PM UTC-4  (US Eastern Daylight / Atlantic)
    - cron: '0 1 * * *'   # UTC 01:00 → 6 PM UTC-5
    - cron: '0 7 * * *'   # UTC 07:00 → 6 PM UTC+1
    - cron: '0 10 * * *'  # UTC 10:00 → 6 PM UTC+4
    - cron: '0 12 * * *'  # UTC 12:00 → ~5:30 PM IST / 6 PM UTC+6
    - cron: '0 16 * * *'  # UTC 16:00 → 6 PM UTC+10
    - cron: '0 22 * * *'  # UTC 22:00 → 6 PM UTC-4

  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      notification_type:
        description: 'Notification type to send'
        required: true
        type: choice
        options:
          - daily_verse
          - recommended_topic
          - streak_reminder
          - memory_verse_reminder
          - memory_verse_overdue
          - meeting_reminder
          - all

jobs:
  # ==========================================================================
  # Job 1: Send Daily Verse Notifications
  # ==========================================================================
  send-daily-verse:
    runs-on: ubuntu-latest
    name: Send Daily Verse Notifications (Prod)

    # Run on schedule OR manual dispatch
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.notification_type == 'daily_verse' ||
        github.event.inputs.notification_type == 'all'))

    steps:
      # No hour gate: the Edge Function selects users whose local time has
      # reached 06:00 and stays deliverable for a catch-up window after it, so
      # every hourly run covers for delayed or dropped scheduled runs. Gating on
      # an exact UTC hour meant one dropped cron skipped a whole timezone band
      # for the day.
      - name: Send Daily Verse Push Notifications (Prod)
        run: |
          echo "Triggering Daily Verse notification Edge Function (Production)..."

          response=$(curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/send-daily-verse-notification" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Daily Verse notifications sent successfully (Production)"
            exit 0
          else
            echo "❌ Failed to send Daily Verse notifications (Production)"
            exit 1
          fi

      - name: Log Execution
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Triggered at: $(date -u)"
          echo "Environment: Production"
          echo "Notification Type: Daily Verse (6 AM local, catch-up window)"

  # ==========================================================================
  # Job 2: Send Recommended Topic Notifications
  # ==========================================================================
  send-recommended-topic:
    runs-on: ubuntu-latest
    # Runs after send-daily-verse so the cross-category spacing check can see
    # what was already sent this run. always() keeps the chain going when an
    # earlier category has nothing to send or fails.
    needs: [send-daily-verse]
    name: Send Recommended Topic Notifications (Prod)

    # Run on schedule OR manual dispatch
    # always() so one category failing or having nothing to send does not
    # break the chain for the categories after it.
    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.notification_type == 'recommended_topic' ||
          github.event.inputs.notification_type == 'all'))
      )

    steps:
      # No hour gate — see the Daily Verse job above; the Edge Function owns the
      # local-time window and every hourly run acts as a catch-up.
      - name: Send Recommended Topic Push Notifications (Prod)
        run: |
          echo "Triggering Recommended Topic notification Edge Function (Production)..."

          response=$(curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/send-recommended-topic-notification" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "Response Code: $http_code"
          echo "Response Body: $body"
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Recommended Topic notifications sent successfully (Production)"
            exit 0
          else
            echo "❌ Failed to send Recommended Topic notifications (Production)"
            exit 1
          fi

      - name: Log Execution
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Triggered at: $(date -u)"
          echo "Environment: Production"
          echo "Notification Type: Recommended Topic (8 AM local, catch-up window)"

  # ==========================================================================
  # Job 3: Send Streak Reminder Notifications
  # ==========================================================================
  send-streak-reminder:
    runs-on: ubuntu-latest
    # Runs after send-memory-verse-reminder so the cross-category spacing check can see
    # what was already sent this run. always() keeps the chain going when an
    # earlier category has nothing to send or fails.
    needs: [send-memory-verse-reminder]
    name: Send Streak Reminder Notifications (Prod)

    # Run every hour (users set their own reminder time)
    # always() so one category failing or having nothing to send does not
    # break the chain for the categories after it.
    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.notification_type == 'streak_reminder' ||
          github.event.inputs.notification_type == 'all'))
      )

    steps:
      - name: Send Streak Reminder Push Notifications (Prod)
        run: |
          echo "Triggering Streak Reminder notification Edge Function (Production)..."

          response=$(curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/send-streak-reminder-notification" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response Code: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Streak Reminder notifications sent successfully (Production)"
            exit 0
          else
            echo "❌ Failed to send Streak Reminder notifications (Production)"
            exit 1
          fi

      # "Streak Reset Motivation" — for users whose streak has already broken.
      # Detected server-side (~10 AM local, catch-up window); it used to be
      # triggered by the app, which meant it could only fire once the user had
      # already returned.
      - name: Send Streak Lost Push Notifications (Prod)
        run: |
          echo "Triggering Streak Lost notification Edge Function (Production)..."

          response=$(curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/send-streak-reminder-notification?type=lost" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response Code: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Streak Lost notifications sent successfully (Production)"
            exit 0
          else
            echo "❌ Failed to send Streak Lost notifications (Production)"
            exit 1
          fi

      - name: Log Execution
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Triggered at: $(date -u)"
          echo "Environment: Production"
          echo "Notification Type: Streak Reminder + Streak Lost (Hourly)"

  # ==========================================================================
  # Job 4: Send Memory Verse Reminder Notifications
  # ==========================================================================
  send-memory-verse-reminder:
    runs-on: ubuntu-latest
    # Runs after send-recommended-topic so the cross-category spacing check can see
    # what was already sent this run. always() keeps the chain going when an
    # earlier category has nothing to send or fails.
    needs: [send-recommended-topic]
    name: Send Memory Verse Reminder Notifications (Prod)

    # Run on schedule OR manual dispatch
    # always() so one category failing or having nothing to send does not
    # break the chain for the categories after it.
    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.notification_type == 'memory_verse_reminder' ||
          github.event.inputs.notification_type == 'all'))
      )

    steps:
      # No hour gate: get_memory_verse_reminder_notification_users() matches on
      # the user's local time with a catch-up window, so every hourly run covers
      # for delayed or dropped scheduled runs.
      - name: Send Memory Verse Reminder Push Notifications (Prod)
        run: |
          echo "Triggering Memory Verse Reminder notification Edge Function (Production)..."

          response=$(curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/send-memory-verse-notification?type=reminder" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response Code: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Memory Verse Reminder notifications sent successfully (Production)"
            exit 0
          else
            echo "❌ Failed to send Memory Verse Reminder notifications (Production)"
            exit 1
          fi

      - name: Log Execution
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Triggered at: $(date -u)"
          echo "Environment: Production"
          echo "Notification Type: Memory Verse Reminder (user's local time, catch-up window)"

  # ==========================================================================
  # Job 5: Send Memory Verse Overdue Notifications
  # ==========================================================================
  send-memory-verse-overdue:
    runs-on: ubuntu-latest
    # Runs after send-streak-reminder so the cross-category spacing check can see
    # what was already sent this run. always() keeps the chain going when an
    # earlier category has nothing to send or fails.
    needs: [send-streak-reminder]
    name: Send Memory Verse Overdue Notifications (Prod)

    # Runs on every scheduled trigger: the selector targets 6 PM in the user's
    # own timezone with a catch-up window, so it no longer depends on a fixed
    # set of UTC hours firing reliably.
    # always() so one category failing or having nothing to send does not
    # break the chain for the categories after it.
    if: |
      always() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' &&
         (github.event.inputs.notification_type == 'memory_verse_overdue' ||
          github.event.inputs.notification_type == 'all'))
      )

    steps:
      - name: Send Memory Verse Overdue Push Notifications (Prod)
        run: |
          echo "Triggering Memory Verse Overdue notification Edge Function (Production)..."

          response=$(curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/send-memory-verse-notification?type=overdue" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response Code: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Memory Verse Overdue notifications sent successfully (Production)"
            exit 0
          else
            echo "❌ Failed to send Memory Verse Overdue notifications (Production)"
            exit 1
          fi

      - name: Log Execution
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Triggered at: $(date -u)"
          echo "Environment: Production"
          echo "Notification Type: Memory Verse Overdue (6 PM)"

  # ==========================================================================
  # Job 6: Send Fellowship Meeting Reminders
  # ==========================================================================
  send-meeting-reminders:
    runs-on: ubuntu-latest
    name: Send Meeting Reminders (Prod)

    # Runs every hour (same as streak-reminder).
    # Google Calendar handles the precise 5-min popup; this FCM push is a best-effort heads-up.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.notification_type == 'meeting_reminder' ||
        github.event.inputs.notification_type == 'all'))

    steps:
      - name: Send Meeting Reminder Push Notifications (Prod)
        run: |
          echo "Triggering fellowship-meetings/reminder Edge Function (Production)..."

          response=$(curl -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/fellowship-meetings/reminder" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\n%{http_code}" \
            -s)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response Code: $http_code"
          echo "Response Body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Meeting reminders dispatched successfully (Production)"
            exit 0
          else
            echo "❌ Failed to dispatch meeting reminders (Production)"
            exit 1
          fi

      - name: Log Execution
        if: always()
        run: |
          echo "Job Status: ${{ job.status }}"
          echo "Triggered at: $(date -u)"
          echo "Environment: Production"
          echo "Notification Type: Meeting Reminders (Hourly)"

  # ==========================================================================
  # Job 7: Monitor Notification Health
  # ==========================================================================
  monitor-health:
    runs-on: ubuntu-latest
    name: Monitor Notification System Health (Prod)
    needs: [send-daily-verse, send-recommended-topic, send-streak-reminder, send-memory-verse-reminder, send-memory-verse-overdue, send-meeting-reminders]
    if: always()

    steps:
      - name: Check Job Results
        run: |
          echo "Daily Verse Job Status: ${{ needs.send-daily-verse.result }}"
          echo "Recommended Topic Job Status: ${{ needs.send-recommended-topic.result }}"
          echo "Streak Reminder Job Status: ${{ needs.send-streak-reminder.result }}"
          echo "Memory Verse Reminder Job Status: ${{ needs.send-memory-verse-reminder.result }}"
          echo "Memory Verse Overdue Job Status: ${{ needs.send-memory-verse-overdue.result }}"
          echo "Meeting Reminders Job Status: ${{ needs.send-meeting-reminders.result }}"

          if [ "${{ needs.send-daily-verse.result }}" == "failure" ] || \
             [ "${{ needs.send-recommended-topic.result }}" == "failure" ] || \
             [ "${{ needs.send-streak-reminder.result }}" == "failure" ] || \
             [ "${{ needs.send-memory-verse-reminder.result }}" == "failure" ] || \
             [ "${{ needs.send-memory-verse-overdue.result }}" == "failure" ] || \
             [ "${{ needs.send-meeting-reminders.result }}" == "failure" ]; then
            echo "⚠️ One or more notification jobs failed in Production"
            echo "Please check Supabase Edge Function logs for details"
            exit 1
          else
            echo "✅ All notification jobs completed successfully (Production)"
          fi
